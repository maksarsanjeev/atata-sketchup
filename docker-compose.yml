services:
  atata:
    build: .
    image: atata-sketchup:latest
    container_name: atata-sketchup
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - atata-data:/data
      # SketchUp SDK не входит в образ: чужие бинарники и десятки мегабайт.
      # Распакуйте рядом и смонтируйте. Без этого сервис работает без
      # слоя геометрии и честно сообщает об этом в отчёте.
      - ${ATATA_SDK_HOST_PATH:-./sdk}:/sdk:ro
    environment:
      ATATA_DATA_DIR: /data
      ATATA_MAX_UPLOAD_MB: "1024"
      ATATA_JOB_TTL_HOURS: "6"
      ATATA_SDK_PATH: /sdk
      # Строго одна тяжёлая задача за раз: разбор геометрии съедает около
      # 4.7 ГБ на файле 348 МБ, две параллельные не влезут в лимит.
      ATATA_MAX_WORKERS: "1"
    # Замеры на файле 348 МБ: контейнерный слой — 552 МБ, слой геометрии
    # под Wine — 4.65 ГБ. Лимит 6 ГБ оставляет запас на файлы покрупнее.
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 3.5
    tmpfs:
      - /tmp:size=1g

volumes:
  atata-data:
