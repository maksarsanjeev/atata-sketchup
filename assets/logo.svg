<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="atata-sketchup: хлыст бьёт по красной попе 3D-куба">
  <title>atata-sketchup</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd6ec"/>
      <stop offset="55%" stop-color="#ff9ed2"/>
      <stop offset="100%" stop-color="#ff5fb0"/>
    </linearGradient>
    <linearGradient id="cheek" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ff8b8b"/>
      <stop offset="45%" stop-color="#f93b3b"/>
      <stop offset="100%" stop-color="#c00d2e"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe3f3"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd0ea"/>
      <stop offset="100%" stop-color="#ffa8d6"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffbfe2"/>
      <stop offset="100%" stop-color="#ff8ec9"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff2d6f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2d6f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8c0044" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- фон -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g opacity="0.35" fill="#fff">
    <circle cx="70" cy="88" r="5"/><circle cx="118" cy="52" r="3"/>
    <circle cx="440" cy="430" r="5"/><circle cx="396" cy="466" r="3"/>
    <circle cx="62" cy="404" r="4"/>
  </g>

  <!-- бантик, потому что kitty -->
  <g transform="translate(96 96) rotate(-18)">
    <path d="M0 0 C-30-22 -52-10 -46 10 C-42 26 -18 26 0 8 Z" fill="#ff2d84"/>
    <path d="M0 0 C30-22 52-10 46 10 C42 26 18 26 0 8 Z" fill="#ff2d84"/>
    <circle cx="0" cy="4" r="9" fill="#ffe3f3"/>
  </g>

  <!-- куб: обобщённая изометрия, не логотип SketchUp -->
  <g filter="url(#soft)" stroke="#3a0b28" stroke-width="7" stroke-linejoin="round">
    <path d="M256 176 L346 226 L256 276 L166 226 Z" fill="url(#faceTop)"/>
    <path d="M166 226 L256 276 L256 372 L166 322 Z" fill="url(#faceLeft)"/>
    <path d="M346 226 L256 276 L256 372 L346 322 Z" fill="url(#faceRight)"/>
  </g>

  <!-- красная попа, отхватившая ата-та -->
  <g filter="url(#soft)">
    <ellipse cx="222" cy="366" rx="56" ry="50" fill="url(#cheek)" stroke="#7d0322" stroke-width="7"/>
    <ellipse cx="292" cy="366" rx="56" ry="50" fill="url(#cheek)" stroke="#7d0322" stroke-width="7"/>
    <path d="M257 320 C247 344 247 390 257 414" fill="none" stroke="#7d0322" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="206" cy="378" rx="30" ry="24" fill="url(#blush)"/>
    <ellipse cx="308" cy="378" rx="30" ry="24" fill="url(#blush)"/>
  </g>

  <!-- следы от хлыста -->
  <g stroke="#5e0018" stroke-width="9" stroke-linecap="round" opacity="0.75">
    <path d="M196 348 L246 386"/>
    <path d="M272 344 L322 382"/>
  </g>

  <!-- хлыст -->
  <g fill="none" stroke="#2c0a1e" stroke-linecap="round">
    <path d="M470 92 C446 150 430 210 386 262 C356 298 330 322 300 340"
          stroke-width="13"/>
    <path d="M300 340 C318 348 336 352 352 348" stroke-width="8"/>
    <path d="M470 92 L498 66" stroke-width="24"/>
  </g>
  <circle cx="470" cy="92" r="11" fill="#ff2d84" stroke="#2c0a1e" stroke-width="6"/>

  <!-- удар -->
  <g transform="translate(302 336)">
    <path d="M0 0 L34-16 L20 6 L52 4 L22 20 L44 42 L12 28 L10 58 L-4 26 L-28 44 L-14 14 L-46 12 L-16-2 Z"
          fill="#fff33f" stroke="#2c0a1e" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <text x="256" y="470" text-anchor="middle"
        font-family="Comic Sans MS, Comic Neue, cursive" font-size="58" font-weight="700"
        fill="#fff" stroke="#c0006a" stroke-width="7" paint-order="stroke"
        letter-spacing="4">АТА-ТА!</text>
</svg>
